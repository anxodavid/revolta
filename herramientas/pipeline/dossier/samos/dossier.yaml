id: samos-mosteiro
titulo: O mosteiro de Samos, contado para durmir
dossier: '- [GL-MOST] O mosteiro de San Xulián de Samos é un mosteiro medieval fundado no século sexto.

  - [GL-MOST] (lenda: contar como "contábase que...") Segundo a tradición, fundouno Martiño de Dumio.

  - [GL-MOST] Chegou a ser un dos mosteiros de maior importancia de Galicia e hoxe está en bo estado de conservación.

  - [GL-MOST] Pertence á orde dos beneditinos e está no concello de Samos, na provincia de Lugo.

  - [GL-MOST] Froitoso de Braga renovouno no século sétimo.

  - [GL-MOST] O primeiro escrito que o menciona é unha inscrición nos muros do claustro da portaría, que di que o reconstruíu
  o bispo de Lugo Ermefredo.

  - [GL-MOST] Despois foi abandonado coa invasión musulmá, ata a reconquista do rei Froila I.

  - [GL-MOST] Cando asasinaron a Froila, a súa viúva e o seu fillo, o futuro Afonso II o Casto, atoparon refuxio no mosteiro.

  - [GL-SAMOS] O futuro rei Afonso II pasou alí a adolescencia.

  - [GL-MOST] Así gañou a protección real, empezando por propiedades de media milla á redonda.

  - [GL-MOST] A comezos do século décimo o bispo Ero de Lugo quixo facerse co mosteiro e expulsou os monxes.

  - [ES-MOST] Os condes Arias e Gutierre Menéndez repoboaron o mosteiro con monxes novos.

  - [GL-MOST] No mesmo século volveu ocuparse por vontade do rei Ordoño II.

  - [GL-MOST] Desde o ano novecentos sesenta a comunidade viviu baixo a regra de San Bieito.

  - [GL-MOST] No século doce sumouse á reforma cluniacense.

  - [GL-MOST] Na Idade Media tivo moita importancia; posuía duascentas vilas e quiñentos lugares.

  - [GL-SAMOS] O papa Alexandre III concedeulle unha bula con dereitos e rendas sobre moitas igrexas de todo o reino.

  - [GL-MOST] No ano mil cincocentos cincuenta e oito un incendio obrigou a reconstruílo enteiro.

  - [GL-MOST] Os monxes beneditinos volveron en mil oitocentos oitenta.

  - [GL-MOST] En setembro de mil novecentos cincuenta e un sufriu outro incendio e reconstruíuse.

  - [GL-MOST] O escritor Ramón Cabanillas viviu alí un tempo e dedicoulle a súa última obra publicada en vida.

  - [GL-MOST] No mosteiro hai tres estilos, o gótico tardío, o renacentista e o barroco.

  - [GL-MOST] A igrexa barroca construíuse entre mil setecentos trinta e catro e mil setecentos corenta e oito.

  - [GL-MOST] O interior da igrexa é luminoso e solemne, e a bóveda ilumínana oito óculos.

  - [GL-MOST] A fachada vai precedida dunha escalinata en forma de lazo que lembra a do Obradoiro.

  - [GL-MOST] A biblioteca mide trinta e un metros de longo e garda uns vinte e cinco mil volumes.

  - [GL-MOST] O Claustro Grande construíuse entre mil seiscentos oitenta e cinco e mil seiscentos oitenta e nove e é o maior
  de España.

  - [GL-MOST] Chámase do padre Feijoo porque este tomou alí o hábito beneditino.

  - [GL-MOST] Preside o claustro unha estatua de Feijoo feita por Francisco Asorey.

  - [GL-MOST] O Claustro Pequeno, ou das Nereidas, construíuse entre mil cincocentos trinta e nove e mil cincocentos oitenta
  e dous.

  - [GL-MOST] Nunha clave do Claustro Pequeno hai unha inscrición de broma que di "¿Qué miras, bobo?".

  - [GL-MOST] No centro do Claustro Pequeno está a fonte barroca das Nereidas.

  - [GL-MOST] O mosteiro é parada importante do Camiño de Santiago porque ten hospedaría.

  - [GL-SAMOS] Moitos peregrinos desvíanse do camiño entre Triacastela e Sarria para visitar o mosteiro.

  - [GL-CAPELA] Detrás do mosteiro está a capela de San Salvador, ou do Ciprés, unha construción sinxela do século noveno.

  - [GL-CAPELA] Dentro da capela hai frescos do século décimo con cruces, portadas e decoracións florais.

  - [GL-CAPELA] (lenda: contar como "contábase que...") A capela está abrazada polo río, e pode que estea onde estaba o primeiro
  mosteiro.

  - [GL-CAPELA] Co tempo a capela quedou abandonada e serviu de alpendre para gardar aveños do campo.

  - [GL-CAPELA] Leva o nome dun ciprés próximo de vinte e sete metros de altura.

  - [GL-SAMOS] Samos está nas serras orientais de Galicia; o relevo é moi accidentado e a altitude media pasa dos setecentos
  metros.

  - [GL-SAMOS] (lenda: contar como "contábase que...") O nome vén de Samanos, que quizais se refire a un lugar habitado por
  unha comunidade relixiosa.

  - [GL-SAMOS] Nos séculos dezasete e dezaoito fixéronse moitas obras que lle deron a arquitectura actual.

  - [GL-SAMOS] Polo concello baixa o río Sarria, afluente do Miño.

  '
