dossier: |
  - [RF] Ao sur de Compostela hai un outeiro con restos da fortaleza da Rocha Forte: anacos de muralla e a planta dos muros entre a vexetación; o sitio está en ruínas.
  - [RF, Preito Tabera-Fonseca] Desde a Rocha Forte asegurábanse os camiños que ían cara a Pontevedra, Padrón, Muros, Noia e Fisterra (cara ao mar).
  - [B-EUR] A Rocha Forte era do arcebispo de Compostela.
  - [B-PODER] A xente da cidade e os labregos da súa comarca decidiron botar abaixo a Rocha Forte despois dun asalto.
  - [B-2024] O alzamento irmandiño foi entre as primaveras de mil catrocentos sesenta e sete e mil catrocentos sesenta e nove.
  - [B-EUR, B-PODER] Na irmandade xuntáronse labregos, artesáns, mariñeiros, burgueses, clérigos (cóengos e monxes) e parte da pequena nobreza, que achegou experiencia militar.
  - [B-VR p. 211, B-2006] Os irmandiños derrubaron moitas das fortalezas do reino (non dar cifras).
  - [B-2024] En mil catrocentos sesenta e nove houbo unha reacción armada dos señores, que regresaron.
  - [B-2006] Moito despois, entre mil cincocentos vinte e seis e mil cincocentos vinte e sete, douscentas catro testemuñas vellas declararon ante escribáns no Preito Tabera-Fonseca e lembraban o que viran de mozos.
  - [B-EUR, B-GUERRA] Arredor da metade do século quince, Galicia era unha sociedade de labregos, artesáns, mariñeiros e mercadores; moitos eran vasalos dun señor.
  - [B-XUNTA] Os vasalos pagaban tributos en diñeiro e en especie e debían servizos persoais: traballo nas fortalezas e servizo de armas.
  - [B-PODER] Moitas familias labregas vivían no limiar da pobreza.
  - [B-XUNTA] O señor era tamén xuíz no seu señorío.
  - [B-PODER] Desde había un século mandaba unha nobreza nova, máis violenta, e o reino enchérase de fortalezas.
  - [B-GUERRA, B-2006] Había fortalezas das grandes casas nobres, como Lemos ou Andrade, de bispos e, sobre todo, do arcebispo de Compostela.
  - [B-PODER, B-2006] Os vasalos dicían que desde as fortalezas se facían os males e os danos, e as testemuñas chamábanlles refuxios de malfeitores.
  - [B-XUNTA] Unhas décadas antes, os vasalos dun gran señor das Mariñas formaran unha irmandade e marcharan cara a Compostela; foi vencida e castigada. Despois houbo outras irmandades locais e comarcais, e algunha derrubou fortalezas.
  - [B-2024] Desde a peste negra as rendas dos señores minguaban en toda Europa e a presión señorial sobre os vasalos aumentaba.
