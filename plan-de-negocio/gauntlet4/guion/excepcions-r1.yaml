# Excepcións propostas para a porta de veracidade do guion v2, rolda 1 (longo.py --excepcions).
# Propón: o guionista do Gauntlet 4 (axente Claude), 02-10-2026. Decide: o crítico B (filólogo e verificador).
# Son frases de tecido do gancho (as primeiras 280 palabras, onde a porta esixe apoio a todas): o fío, os bucles e
# a promesa. Ningunha engade nomes, datas, cifras nin feitos que non estean no dossier. Ver feitos-r1.md.
- frase: "As palabras do conxuro parecen vellas e son novas, e hai un motivo polo que semellan de ninguén."
  xustificacion: "Síntese do arranque (S1-S4: F001-F004 e F246, o conxuro parece de séculos e é de 1967) e anuncio do bucle que se paga en S42 (F014: copias sen o nome do autor, e por iso parecía popular e anónimo). Non engade feitos. (proposta do guionista, axente Claude)"
- frase: "As de Dorotea son vellas de verdade, e só as coñecemos porque alguén as escribiu nun proceso por bruxería."
  xustificacion: "Síntese de S5-S8: as palabras atribuídas a Dorotea son de 1617 (F006) e chegan polo testemuño recollido no proceso da Real Audiencia (F008, 'Segundo declarou unha testemuña'; F055, o papel do proceso). Non afirma nada novo de Dorotea. (proposta do guionista, axente Claude)"
- frase: "Nos papeis daqueles procesos hai moitas máis palabras."
  xustificacion: "Paráfrase de F128 ('Nos papeis daqueles procesos aparecen tamén frases en galego'); presenta os bucles de S15 e S16. (proposta do guionista, axente Claude)"
- frase: "Hai unha palabra trabucada que ninguén borrou en máis de catrocentos anos."
  xustificacion: "Bucle que se paga en S28-S30: no papel de 1617 quedou escrita a emenda 'que trouxese auga, digo, leite' (F055, F006; o PDF do Arquivo transcribe 'traxese agua, digo, leche', co 'agua' sen borrar). De 1617 a 2026 van 409 anos. (proposta do guionista, axente Claude)"
- frase: "Detrás de todas esas palabras había mulleres de aldea."
  xustificacion: "Síntese: as acusadas dos procesos que se contan eran veciñas de parroquias rurais (Vilalba, F006 e F051; Boborás, F088; Campo Lameiro, F129) e nos procesos da Real Audiencia todas eran mulleres (F085). Introduce F048 (S18). (proposta do guionista, axente Claude)"
- frase: "Esta noite imos buscalas no pouco que delas quedou escrito."
  xustificacion: "Promesa do narrador, sen contido factual: anuncia o fío do episodio (as palabras escritas por outros, S31 e S101). (proposta do guionista, axente Claude)"
