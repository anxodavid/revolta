# Excepcións da porta de veracidade do guion v2, rolda 2 (longo.py --excepcions).
# Base: excepcions-r1.yaml tal como o deixou o crítico B (axente Claude, 03-10-2026; razóns en
# plan-de-negocio/gauntlet4/veredictos/guion-r1-lingua-veracidade.md §6). Cambio do guionista (axente Claude) na rolda 2:
# a promesa do gancho (S19) leva agora a pregunta central (mellora A5 do crítico A), así que a súa entrada cambia de
# frase; a xustificación é a mesma. Ningunha persoa as revisou.
- frase: "As palabras do conxuro parecen vellas e son novas, e hai un motivo polo que semellan de ninguén."
  xustificacion: "Tecido do gancho: resume S1-S4 (F001-F004 e F246: parece de séculos e é de 1967) e anuncia o motivo que se paga en S42 (F014: copias sen o nome do autor). Non engade feitos. (crítico B, axente Claude)"
- frase: "O que se contou de Dorotea é vello de verdade, e só o coñecemos porque alguén o escribiu nun proceso por bruxería."
  xustificacion: "Síntese de S5-S8: o que unha testemuña declarou de Dorotea (F008-F010) é de 1617 (F006) e coñécese porque quedou escrito no proceso (F055). Non engade feitos. (crítico B, axente Claude)"
- frase: "Hai unha palabra trabucada que ninguén borrou en máis de catrocentos anos."
  xustificacion: "Bucle que se paga en S28-S30: a emenda «auga, digo, leite» quedou escrita no papel de 1617 (F055, F006) e a transcrición do Arquivo de 2020 aínda a trae («traxese agua, digo, leche», PDF p. 15): de 1617 a 2020 van 403 anos. (crítico B, axente Claude)"
- frase: "E hai mesmo noticia dunha lista coas mulleres que uns veciños viron nunha fonte, a noite de san Xoán."
  xustificacion: "Preventiva (substitución 3). Bucle que se paga en S59-S66: unha testemuña declarou que uns veciños viron e recoñeceron as mulleres na fonte a noite de san Xoán e as apuntaron nunha lista (F050, F131-F133). Di noticia porque nos papeis consta o testemuño, non a lista. (crítico B, axente Claude)"
- frase: "Había mulleres de aldea detrás de todas esas palabras."
  xustificacion: "Síntese: as acusadas dos tres casos eran veciñas de parroquias rurais (San Xiao de Mourence, Vilalba, F051; Pazos de Arenteiro, Boborás, F088; Santa Mariña das Fragas, Campo Lameiro, F129). Prepara F048 (S18). Non engade feitos. (crítico B, axente Claude)"
- frase: "Esta noite imos buscalas no pouco que delas quedou escrito, e preguntarnos de quen son, de verdade, esas palabras."
  xustificacion: "Promesa do narrador, sen contido factual: anuncia o fío do episodio, as palabras daquelas mulleres escritas por outros (S31 e S101). (crítico B, axente Claude)"
- frase: "E contou que María, cando tiña o gando no monte, dicía unhas palabras: unhas en voz baixa, e outras que se oían."
  xustificacion: "Preventiva (substitución 5). F053 coa redacción da fonte («callando y otras que se oyan»); o suxeito de contou é a testemuña da frase anterior, que o sabía de oídas (F052; PDF p. 15, folio 3 verso). (crítico B, axente Claude)"
