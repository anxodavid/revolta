feitos:
# ------------------------------------------------------------------ C0 arranque en frío
- id: F001
  cap: C0
  tipo: H
  feito: "O conxuro máis coñecido da queimada comeza así: «Mouchos, curuxas, sapos e bruxas»."
  nota: "Dereitos: o conxuro está rexistrado (2001) e o autor morreu en 2022. Citar como moito ese primeiro verso, sempre co nome do autor. Non recitalo."
  evidencias:
  - {fonte: GL-QUEIMADA, cita: "Mouchos, curuxas, sapos e bruxas."}
  - {fonte: GCIENCIA-21, cita: "Mouchos, curuxas, sapos e bruxas"}
- id: F002
  cap: C0
  tipo: H
  feito: "Ese conxuro escribiuno Mariano Marcos Abalo en Vigo, no ano mil novecentos sesenta e sete."
  evidencias:
  - {fonte: ATLANTICO, cita: "La célebre frase miles de veces repetidas de Mouchos, curuxas, sapos e bruxas brotaría de su imaginación en 1967"}
  - {fonte: GCIENCIA-21, cita: "foi creado no ano 1967 por Mariano Marcos Abalo"}
  - {fonte: GL-QUEIMADA, cita: "por Mariano Marcos Abalo para unha festa de xogos florais"}
- id: F003
  cap: C0
  tipo: H
  feito: "Moita xente cre que o conxuro da queimada vén da noite dos tempos, pero ten autor coñecido e é de mil novecentos sesenta e sete."
  evidencias:
  - {fonte: ATLANTICO, cita: "quizá el pueblo cree nacido en la noche de los tiempos. Pero no: tenía autor reconocido"}
  - {fonte: CORREO, cita: "Lo escribió en 1967 a bordo de un barco decomisado"}
- id: F246
  cap: C0
  tipo: H
  feito: "Case todo galego, e moitos visitantes, oíron algunha vez o conxuro nunha queimada, e todo nel parece levarnos moitos séculos atrás, a unha tradición milenaria."
  nota: "Para a frase do gancho que se dirixe a quen escoita (seguramente oíches este conxuro...)."
  evidencias:
  - {fonte: GCIENCIA-21, cita: "que case todo galego e visitante no país puido presenciar nalgún momento da súa vida, parecen tomarnos do brazo e levarnos a moitos séculos atrás"}
  - {fonte: GCIENCIA-21, cita: "Todo parece formar parte dunha tradición milenaria"}
- id: F004
  cap: C0
  tipo: H
  feito: "Mariano Marcos Abalo escribiuno a bordo dun vello barco comisado, amarrado no porto de Vigo, onde se xuntaba cos amigos para facer queimadas."
  evidencias:
  - {fonte: CORREO, cita: "solía reunirse con unos amigos a bordo de un viejo barco que había sido decomisado"}
  - {fonte: CORREO, cita: "Alí facíamos de vez en cando queimadas e guateques"}
  - {fonte: GL-QUEIMADA, cita: "nun barco comisado amarrado no porto da cidade"}
- id: F005
  cap: C0
  tipo: H
  feito: "Segundo contou el mesmo, quería darlles un pouco de ritual ás queimadas que facía cos amigos nos anos sesenta."
  evidencias:
  - {fonte: ATLANTICO, cita: "La idea surgió con la finalidad de dotar de cierta ritualidad a las queimadas que organizaba Marcos y un grupo de amigos durante los años 60"}
# ------------------------------------------------------------------ C0 parteira de Vilalba
- id: F006
  cap: C0
  tipo: H
  feito: "En mil seiscentos dezasete, en Vilalba, a Real Audiencia de Galicia xulgou a Dorotea do Barro e á súa filla, María do Barro."
  evidencias:
  - {fonte: ARG, cita: "Dorotea do Barro e a súa filla, María do Barro Real Audiencia de Galicia Data: 1617"}
- id: F007
  cap: C0
  tipo: H
  feito: "Dorotea do Barro, a nai, era parteira."
  nota: "Resolto co texto do proceso: a parteira é Dorotea (a nai); a alcaiota é María (a filla). Ver conflitos en dossier.md."
  evidencias:
  - {fonte: ARG, cita: "la dicha Doratea madre de la dicha acusada ablando con ella en razón del ofiçio de partera que la susodicha tenía y aún al presente exerze"}
  - {fonte: ARG, cita: "bruxas, parteira e alcaiota"}
- id: F008
  cap: C0
  tipo: H
  feito: "Segundo declarou unha testemuña, Andrés da Pena, Dorotea do Barro dixera que podía quitarlle as dores do parto a unha muller e pasarllas a un home que estivese ao seu carón."
  nota: "É un só testemuño: dicir sempre 'segundo declarou unha testemuña' e 'dixera' ou 'dixo', non 'dicía'."
  evidencias:
  - {fonte: ARG, cita: "si quería, hestando una muger en dolores de parto quitaría los dichas dolores que ella tubiesse y las hecharía a un hombre que hestuviesse junto a ella"}
  - {fonte: ARG, cita: "Testemuño de Andrés da Pena"}
- id: F009
  cap: C0
  tipo: H
  feito: "Abondaba, segundo esa testemuña, con quitarlle os zapatos á muller que ía parir e calzarllos ao home, dicindo unhas palabras que ela sabía."
  evidencias:
  - {fonte: ARG, cita: "esto quitando los çapatos que la mesma que tuviese para parir tuviese calzos"}
  - {fonte: ARG, cita: "calzar al dicho hombre con algunas palabras que savía"}
- id: F010
  cap: C0
  tipo: H
  feito: "E, segundo a mesma testemuña, dixera que o home saltaría coma un poldro bravo."
  evidencias:
  - {fonte: ARG, cita: "que aría saltar al dicho hombre a quien las hechase como a un potro bravo"}
- id: F011
  ficha: false
  cap: C0
  tipo: H
  feito: "O Arquivo do Reino de Galicia resumiu o proceso de Vilalba con tres palabras: bruxas, parteira e alcaiota."
  evidencias:
  - {fonte: ARG, cita: "bruxas, parteira e alcaiota San Xiao de Mourence, Vilalba . 1617"}
- id: F012
  cap: C0
  tipo: H
  feito: "A filla, María do Barro, foi acusada de alcaiota: dicían que acollía na súa casa homes casados e mulleres solteiras."
  evidencias:
  - {fonte: ARG, cita: "que la dicha María do Barro hera alcagueta y que como tal recoxía en su casa a hombres casados y mugeres solteras"}
  - {fonte: "RAG:alcaiote", cita: "Persoa que serve de intermediaria en asuntos amorosos"}
# ------------------------------------------------------------------ CQ a queimada: vello e novo
- id: F013
  ficha: false
  cap: CQ
  tipo: H
  feito: "En mil novecentos setenta e catro, Mariano Marcos Abalo engadiulle ao conxuro dúas estrofas, coas referencias a Satán e Belcebú."
  evidencias:
  - {fonte: CORREO, cita: "una composición a la que en 1974 añadiría dos estrofas"}
  - {fonte: GL-QUEIMADA, cita: "e engadiulle as referencias a Satán e Belcebú"}
- id: F014
  cap: CQ
  tipo: H
  feito: "Unha empresa vendeu copias do conxuro sen o nome do autor, e por iso moita xente pensou que era un texto popular e anónimo."
  evidencias:
  - {fonte: ATLANTICO, cita: "empezó a circular anónimo por toda Galicia, razón por la cual se asimiló un origen popular"}
  - {fonte: GL-QUEIMADA, cita: "o que pode contribuír á crenza de que o esconxuro era dun autor anónimo"}
- id: F015
  cap: CQ
  tipo: H
  feito: "En dous mil un, Mariano Marcos Abalo rexistrou o conxuro como propiedade intelectual."
  evidencias:
  - {fonte: GL-QUEIMADA, cita: "No 2001 Mariano Marcos Abalo decidiu rexistrar a propiedade intelectual do esconxuro"}
  - {fonte: CORREO, cita: "El Gobierno le otorgó en 2001 la propiedad intelectual"}
- id: F016
  ficha: false
  cap: CQ
  tipo: H
  feito: "Dicía que era un orgullo que o conxuro andase por todo o mundo, aínda que non gañase un euro con el."
  evidencias:
  - {fonte: ATLANTICO, cita: "É un orgullo que o Conxuro ande por todo o mundo aínda que non gañe un euro por el"}
- id: F017
  ficha: false
  cap: CQ
  tipo: H
  feito: "Mariano Marcos Abalo naceu na Pobra do Caramiñal, traballou nun banco en Vigo e morreu nesa cidade en dous mil vinte e dous, aos oitenta e cinco anos."
  nota: "O ano da morte sae da data do artigo (7-2-2022: 'acaba de fallecer')."
  evidencias:
  - {fonte: ATLANTICO, cita: "había nacido en Pobra do Caramiñal, pero era vigués ejerciente desde 1960"}
  - {fonte: ATLANTICO, cita: "acaba de fallecer en Vigo a los 85 años"}
  - {fonte: ATLANTICO, cita: "empleado jubilado del Banco Pastor"}
- id: F018
  ficha: false
  cap: CQ
  tipo: H
  feito: "El mesmo contaba que houbo outros cinco ou seis conxuros daquela época, pero que ningún tivo a saída do seu."
  evidencias:
  - {fonte: ATLANTICO, cita: "hai outros cinco ou seis Conxuros dunha época parecida, pero non tiveron a saída que tivo este"}
- id: F019
  ficha: false
  cap: CQ
  tipo: L
  feito: "Popularmente atribúenselle á queimada orixes celtas."
  evidencias:
  - {fonte: GL-QUEIMADA, cita: "Popularmente, á queimada atribúenselle orixes celtas"}
- id: F020
  cap: CQ
  tipo: H
  feito: "Popularmente atribúenselle á queimada orixes celtas, pero en mil novecentos setenta e dous o catedrático Carlos Alonso del Real escribiu que iso era imposible, porque o alambique chegou a Galicia na Idade Media."
  evidencias:
  - {fonte: GL-QUEIMADA, cita: "Popularmente, á queimada atribúenselle orixes celtas"}
  - {fonte: GL-QUEIMADA, cita: "segundo afirmou en 1972 o catedrático de prehistoria da Universidade de Santiago, Carlos Alonso del Real"}
  - {fonte: GL-QUEIMADA, cita: "isto sería imposible, xa que a destilación do augardente en Galicia non pode ser anterior á introdución do alambique"}
- id: F021
  cap: CQ
  tipo: H
  feito: "O historiador Xavier Castro, da Universidade de Santiago, di que a queimada é unha tradición inventada."
  evidencias:
  - {fonte: GCIENCIA-21, cita: "a queimada non é máis ca outra das tradicións inventadas das que fala Eric Hobsbawn"}
- id: F022
  ficha: false
  cap: CQ
  tipo: H
  feito: "Segundo Xavier Castro, as bebidas destiladas non se popularizaron en Galicia ata a segunda metade do século dezanove."
  evidencias:
  - {fonte: GCIENCIA-21, cita: "E segundo Xavier Castro, estas bebidas non se popularizan en Galicia ata a segunda parte do século XIX"}
- id: F023
  ficha: false
  cap: CQ
  tipo: H
  feito: "Aínda así, en mil oitocentos dezasete un libro xa dicía que a augardente queimada con figos secos era un remedio contra a rouquén."
  nota: "Dato histórico (o que dicía un libro), nunca consello."
  evidencias:
  - {fonte: GCIENCIA-21, cita: "a augardente queimada, despois de botar nela infusión de figos secos, é un remedio probado contra a rouquén"}
  - {fonte: GCIENCIA-21, cita: "En 1817, a tradución a español feita por Pedro Charro de Lorenzana"}
- id: F024
  cap: CQ
  tipo: H
  feito: "O antropólogo Xosé Manuel González Reboredo sitúa arredor dos anos cincuenta do século vinte o costume de tomar queimada nas festas, entre galegos que vivían fóra."
  evidencias:
  - {fonte: GL-QUEIMADA, cita: "que el sitúa ao redor dos anos cincuenta do século XX"}
  - {fonte: GL-QUEIMADA, cita: "galegos residentes no exterior comezaron a tomar esta bebida nas festas ou despois das comidas"}
- id: F025
  ficha: false
  cap: CQ
  tipo: H
  feito: "Nesas xuntanzas naceu o costume de acompañar a queimada con conxuros escritos para a ocasión."
  evidencias:
  - {fonte: GL-QUEIMADA, cita: "En xuntanzas deste tipo xurdiría o costume de acompañar o consumo da queimada de esconxuros compostos ex-profeso para o momento"}
- id: F026
  cap: CQ
  tipo: H
  feito: "En mil novecentos cincuenta e cinco, o oleiro de Mondoñedo Tito Freire creou a tarteira de barro con patas na que hoxe se adoita facer a queimada."
  evidencias:
  - {fonte: GL-QUEIMADA, cita: "xa no ano 1955 o oleiro mindoniense Tito Freire, creou o recipiente de barro cocido, con forma de tarteira e patas"}
- id: F027
  cap: CQ
  tipo: H
  feito: "Na taberna de Eligio, en Vigo, escritores e artistas como Cunqueiro, Castroviejo, Laxeiro, Lugrís e Blanco Amor foron construíndo o ritual arredor do pote."
  evidencias:
  - {fonte: GCIENCIA-21, cita: "Na taberna viguesa de Eligio, mais tamén noutros dos moitos lugares nos que departían, Cunqueiro, Castroviejo, Laxeiro, Lugrís ou Blanco Amor comezan a construír aquel ritual arredor do pote"}
- id: F028
  cap: CQ
  tipo: H
  feito: "Castroviejo dicía que botarlle grans de café á queimada era unha horrible herexía moderna."
  evidencias:
  - {fonte: GCIENCIA-21, cita: "horrible herexía moderna"}
- id: F029
  cap: CQ
  tipo: A
  feito: "A queimada faise con augardente e azucre, e adoita levar casca de limón ou de laranxa e uns poucos grans de café."
  evidencias:
  - {fonte: GL-QUEIMADA, cita: "Os seus ingredientes principais son a augardente e o azucre ós que xeralmente se lles bota tamén casca de limón ou laranxa, uns poucos grans de café sen moer"}
- id: F030
  cap: CQ
  tipo: A
  feito: "Préndeselle lume e reméxese amodo, deixando que suban as lapas, ata que se esgota case todo o alcohol."
  evidencias:
  - {fonte: GL-QUEIMADA, cita: "A continuación reméxese lentamente, deixando que suban as lapas do alcohol, creando cascadas con elas. Reméxese ata que se esgota case que todo o alcohol"}
- id: F031
  cap: CQ
  tipo: A
  feito: "Mentres se fai, a xente reúnese arredor do pote, mellor coas luces apagadas, e o conxuro recítase cara ao final."
  evidencias:
