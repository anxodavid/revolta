# Base de evidencias do dossier "As meigas de verdade" (Gauntlet 3, peza DOSSIER, 30-09-2026).
# Escrita a man por Claude (axente constructor do dossier). Ningunha persoa a revisou.
# Cada feito (galego) leva unha ou máis evidencias {fonte, cita}: a cita é un anaco LITERAL da fonte (texto
# descargado o 30-09-2026) e comprobase por código con `xerar.py` (normaliza maiúsculas, espazos e comiñas).
# `ausente`: texto que se comproba que NON está na fonte (proba negativa).
# tipo: H historia documentada; L lenda, crenza ou costume (contado como tal); A ambiente/descrición verdadeira.
# cap: capítulo do arco (contexto.md §8 e veredictos/tema-r1.md §4). nota: indicación para o guionista (non vai á ficha).

capitulos:
  C0: "Arranque en frío (0:00-0:40): o conxuro de 1967 e a parteira de Vilalba"
  CQ: "A queimada: o vello e o novo (arranque en frío ou peche)"
  C0B: "Os papeis que falan (0:55-2:00): a Inquisición, os xuíces e a lista da fonte"
  C1: "Catro aldeas (2:00-5:00): Vilalba e Xinzo de Limia; as crenzas"
  C2: "O tribunal e os xuíces (5:00-8:00)"
  C3: "Quen eran de verdade (8:00-10:00): aquí rematan os xuízos"
  C4: "Herbas, leite e mal de ollo (10:00-16:00): costumes, nunca consellos"
  C5: "A noite de san Xoán (16:00-22:00)"
  C6: "O frade que dubidaba: Feijoo (22:00-26:30)"
  C7: "Peche (26:30-30:00): habelas, hainas; chove na lousa"

